# User override for niri's portal backends.
#
# A file at this path replaces the distro copy at
# /usr/share/xdg-desktop-portal/niri-portals.conf entirely, so the distro
# entries are repeated here with one addition.
#
# default=gnome;gtk sends most interfaces to the GNOME backend, which is the
# only one supporting ScreenCast for compositors that implement the
# ext-image-capture protocols (niri does). Since xdg-desktop-portal-gnome 47
# that backend uses nautilus for file chooser dialogues, and nautilus is not
# installed here, so FileChooser is pinned to the GTK backend to work with
# Dolphin instead.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
