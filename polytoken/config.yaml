    variant: claude
    class: mini
    max_output_tokens_per_turn: 65535
    provider: anthropic
    reasoning:
      type: no_reasoning
    context_window: 400000
  openai/gpt-5.4:
    provider_name: gpt-5.4
    variant: openai
    class: full
    max_output_tokens_per_turn: 65535
    provider: openai
    reasoning:
      type: effort
      can_disable: true
      levels:
      - low
      - medium
      - high
      default_level: high
    context_window: 400000
  openai/gpt-5.4-mini:
