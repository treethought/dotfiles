version: 3
defaults:
  full: agw/gpt-5.6-sol:api(high)
  mini: agw/deepseek-v4.1-flash:api(high)
modelgroups:
  "polytoken:orchestrate_facet": personal-deepseek/deepseek-flash(high)
providers:
  anthropic:
    kind:
      type: catalog
      name: anthropic
    url: https://api.anthropic.com
    auth:
      type: static_key
      key: ${ANTHROPIC_API_KEY_PERSONAL}
    cache_control_strategy: anthropic_breakpoints
  personal-deepseek:
    kind:
      type: catalog
      name: deepseek
    auth:
      type: static_key
      key: ${DEEPSEEK_API_KEY_PERSONAL:-}
  openai:
    kind:
      type: catalog
      name: openai
    url: https://api.openai.com
    auth:
      type: static_key
      key: ${OPENAI_API_KEY_PERSONAL}
  agw:
    kind:
      type: catalog
      name: openai
    url: https://agw.noclues.net
    auth:
      type: static_key
      key: ${AGW_API_KEY}
  agw-anthropic:
    kind:
      type: catalog
      name: anthropic
    url: https://agw.noclues.net
    auth:
      type: static_key
      key: ${AGW_API_KEY}
    cache_control_strategy: anthropic_breakpoints
models:
  anthropic/claude-opus-4-8:
    provider_name: claude-opus-4-8
    variant: claude
    class: full
    max_output_tokens_per_turn: 65535
    provider: anthropic
    context_window: 400000
  anthropic/claude-sonnet-4-6:
    provider_name: claude-sonnet-4-6
    variant: claude
    class: full
    max_output_tokens_per_turn: 65535
