    enabled: false
  agw/gpt-5.4:
    enabled: false
  agw/gpt-5.4-mini:
    enabled: false
  agw/gpt-5.6-sol:
    enabled: false
  agw/gpt-5.6-terra:
    enabled: false
  agw/gpt-5.6-luna:
    enabled: false
  agw/gpt-6-astra:
    enabled: false
  agw/gpt-6-astra:api:
    provider_name: gpt-6-astra:api
    variant: openai
    class: full
    max_output_tokens_per_turn: 65535
    provider: agw
    reasoning:
      type: effort
      effort_set: gpt_6_astra
      can_disable: true
      levels:
      - low
      - medium
      - high
      - xhigh
      - max
