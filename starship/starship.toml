# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Disable the blank line at the start of the prompt
add_newline = true
# Which is equivalent to
format = """
$username\
$hostname\
$localip\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$docker_context\
$package\
$bun\
$deno\
$golang\
$helm\
$nodejs\
$python\
$rust\
$xmake\
$buf\
$memory_usage\
$aws\
$gcloud\
$openstack\
$direnv\
$env_var\
$custom\
$sudo\
$kubernetes\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$container\
$netns\
$os\
$shell\
$character"""

[username]
show_always = false
style_user = "white bold"
style_root = "white bold"
format = '[$user ]($style)'


#[character]
#success_symbol = " [](bold white)"
#error_symbol = " [](bold red)"
#vimcmd_symbol = " [](bold yellow)"
#vimcmd_replace_one_symbol = "◌"
#vimcmd_replace_symbol = "□"
#vimcmd_visual_symbol = "▼"


[directory]
format = "[ $path/ ]($style)"
#style = "white"
truncation_length = 3
truncation_symbol = ""


[git_branch]
symbol = ""
format = '[$symbol $branch]($style)'
# format = 'on [$symbol$branch(:$remote_branch)]($style) '

[git_status]
format = ' [$all_status$ahead_behind]($style) '

[golang]
disabled = true

[aws]
disabled = true
#format = '[$symbol $profile]($style) '
#format = 'on [$symbol($profile )(\($region\) )(\[$duration\] )]($style)'

[gcloud]
disabled = true
format = '[$symbol $profile]($style) '

[cmd_duration]
format = '[$symbol$cmd]($style)'
style = "white bold"
min_time = 10
show_milliseconds = true

[kubernetes]
disabled = false
format = '[$symbol$context]($style) '
